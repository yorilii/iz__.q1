
name: Build Aurora Player APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip AuroraPlayer-Source.zip
          ls AuroraPlayer

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p AuroraPlayer assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Player-APK
          path: AuroraPlayer/app/build/outputs/apk/debug/app-debug.apk
          
